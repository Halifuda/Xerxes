max_clock = 3000000
clock_granu = 1
log_level = "INFO"
log_name = "output/baseline-snp.csv"
edges = [
    [
        "Host-0",
        "Switch",
    ],
    [
        "Host-1",
        "Switch",
    ],
    [
        "Switch",
        "Bus",
    ],
    [
        "Bus",
        "Snoop",
    ],
    [
        "Snoop",
        "Mem",
    ],
]

[devices]
Host-0 = "Requester"
Host-1 = "Requester"
Mem = "DRAMsim3Interface"
Switch = "Switch"
Bus = "DuplexBus"
Snoop = "Snoop"

[Host-0]
q_capacity = 32
cache_capacity = 8192
cache_delay = 12
issue_delay = 0
coherent = true
burst_size = 1
block_size = 64
interleave_type = "stream"
interleave_param = 5000
hot_req_ratio = 0.5
hot_region_ratio = 0.5
trace_file = ""
random_seed = 42

[Host-1]
q_capacity = 32
cache_capacity = 8192
cache_delay = 12
issue_delay = 0
coherent = true
burst_size = 1
block_size = 64
interleave_type = "stream"
interleave_param = 5000
hot_req_ratio = 0.5
hot_region_ratio = 0.5
trace_file = ""
random_seed = 42

[Mem]
tick_per_clock = 1
process_time = 40
start = 0
capacity = 1073741824
wr_ratio = 0.0
config_file = "DRAMsim3/configs/DDR4_8Gb_x8_3200.ini"
output_dir = "output"

[Switch]
delay = 0

[Bus]
is_full = true
half_rev_time = 100
delay_per_T = 1
width = 32
framing_time = 20
frame_size = 256

[Snoop]
line_num = 1024
assoc = 8
max_burst_inv = 8
ranges = [[0, 1073741824]]
eviction = "FIFO"


